<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E7ADC" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // GitHub Pages sends unknown addresses to 404.html, which forwards them here as
      // "/<repo>/?/about". Put the real address back before the app starts.
      (function (l) {
        if (l.search[1] === "/") {
          var d = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
        }
      })(window.location);
    </script>
    <!--seo:start-->
    <title>AdSpark Digital | Digital Advertising, Social Media, SEO &amp; Branding</title>
    <meta name="description" content="We help businesses build their online presence, connect with the right audience, and turn digital attention into meaningful business opportunities." />
    <!--seo:end-->

        .nav__list { display: flex !important; position: static !important; flex-wrap: wrap; box-shadow: none !important; border: 0 !important; padding: 0 !important; }
      </style>
    </noscript>
